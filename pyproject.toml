[project]
name = "kitbag"
version = "0.1.1"
description = "My little personal projects and utilities"
authors = [
    {name = "Sasha Ovsankin", email = "sasha@ovsankin.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "plumbum>=1.9.0",
]

[project.scripts]
genpass = "kitbag.genpass:genpass"
aif2flac = "kitbag.aif2flac:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kitbag"]
